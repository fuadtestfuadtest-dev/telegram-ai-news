name: AI News Bot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  post-ai-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Repo-nu klonla
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python quraşdır
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Asılılıqları yüklə
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: News botu işə sal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: '@AIAZE01'
        run: python news_bot.py

      - name: State-i commit et
        run: |
          git config user.name "ai-news-bot[bot]"
          git config user.email "ai-news-bot[bot]@users.noreply.github.com"
          git add posted_news.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update posted_news [skip ci]"
            git push
          else
            echo "Dəyişiklik yoxdur"
          fi